# Dann of Thursday - Voice AI Agent Config
# Copy to config.yaml and adjust for your system.

audio:
  sample_rate: 16000
  channels: 1
  input_device: null   # null = default mic
  output_device: null  # null = default speaker
  silence_timeout_ms: 1500   # stop recording after this much silence
  max_record_ms: 15000       # max recording length
  silence_threshold: 0.01    # RMS below this = silence

wake_word:
  # openWakeWord: fully offline, no account. Built-in phrases (hey_jarvis,
  # alexa, hey_mycroft, ...) work immediately with no setup — just set
  # model to one of those names below instead of a .onnx path. For a custom
  # "ok Dann" phrase: generate training clips (scripts/generate_wakeword_samples.py)
  # then train (scripts/train_wakeword.py), ~1 min on CPU with clips already made.
  engine: openwakeword
  model: models/ok_dann.onnx   # or a built-in name, e.g. hey_jarvis
  threshold: 0.7
  debounce: 4
  cooldown_ms: 2000

  # Porcupine alternative — higher accuracy, but needs a free AccessKey
  # from https://console.picovoice.ai/ and a platform-specific .ppn file:
  # engine: porcupine
  # access_key: YOUR_PICOVOICE_ACCESS_KEY
  # model_path: models/ok_dann.ppn
  # sensitivity: 0.5

stt:
  engine: faster_whisper
  model_size: small         # tiny, base, small, medium, large-v3-turbo
  language: en
  device: auto              # auto (detects CUDA), cpu, cuda
  compute_type: int8

ollama:
  base_url: http://localhost:11434
  model: llama3.2
  system_prompt: |
    You are a voice assistant with a routing brain. You decide what to handle locally and what to delegate.

    LOCAL (answer yourself, no tools):
    - Greetings, small talk, confirmations ("yes", "thanks", "sounds good")
    - Simple factual questions you are confident about
    - Anything that needs a one-sentence answer

    ROUTE TO ask_claude:
    - Complex reasoning, analysis, or explanation
    - Questions about history, science, philosophy, current events, or broad knowledge
    - Creative tasks (write something, explain a concept deeply, give advice)
    - Anything where you are unsure or the question deserves a thorough answer

    ROUTE TO ask_claude_code:
    - Questions about a specific project ("summarise X", "what does Y do", "what tests are missing")

    ROUTE TO open_claude_code:
    - User explicitly wants to open an interactive coding session ("open Claude Code in X")

    ROUTE TO list_projects:
    - User asks what projects are available

    OPTIONAL MODULES (schedule, notes, system, etc.):
    - If the user's request needs a tool you don't see yet (calendar, notes,
      volume/app control), call enable_module with the module name first —
      its real tools become available right after. Use list_modules if
      you're unsure what's available.

    Rules:
    - Never call a tool for conversational filler.
    - After any tool call, speak the result naturally in 1-2 sentences and stop.
    - Never call the same tool twice in one turn.
    - Never use markdown, lists, or code formatting in your own responses.
  temperature: 0.7
  max_tokens: 80


tts:
  engine: piper
  # Uses piper-tts Python API (works on M1 Mac). piper_path unused.
  voice_model: models/piper/en_US-lessac-medium
  speed: 1.0

mcp:
  servers:
    # always_on: true  -> connected at startup, stays up for the session.
    # always_on: false (default) -> registered but dormant; Dann's LLM
    # starts it on demand via the enable_module tool (see src/mcp_client.py).
    - name: projects
      command: .venv/bin/python
      args: ["-m", "src.mcp_servers.claude_code_server"]
      description: "Project discovery and Claude Code sessions"
      always_on: true

    - name: schedule
      command: .venv/bin/python
      args: ["-m", "src.mcp_servers.schedule_server"]
      description: "Google Calendar — view, create, and search events (needs one-time setup, see schedule-setup.md)"
      always_on: false

    - name: notes
      command: .venv/bin/python
      args: ["-m", "src.mcp_servers.notes_server"]
      description: "Quick notes and reminders, stored locally"
      always_on: false

    - name: system
      command: .venv/bin/python
      args: ["-m", "src.mcp_servers.system_server"]
      description: "Local machine control — volume, opening apps, locking the screen"
      always_on: false

ux:
  play_listening_sound: true
  play_thinking_sound: false

projects:
  # Explicit list of projects Dann can open and query.
  # Paths support ~ expansion. Remove this section to fall back to
  # auto-discovery of all git repos under ~/Git.
  - name: my-project
    path: ~/Git/my-org/my-project
  - name: another-project
    path: ~/Git/my-org/another-project
