# Dann of Thursday - Voice AI Agent Config
# Copy to config.yaml and adjust for your system.

audio:
  sample_rate: 16000
  channels: 1
  input_device: null   # null = default mic
  output_device: null  # null = default speaker
  silence_timeout_ms: 1500   # stop recording after this much silence
  max_record_ms: 15000       # max recording length
  silence_threshold: 0.01    # RMS below this = silence
  min_speech_rms: 0.005      # whole-recording RMS below this = discard silently, no STT/TTS
                             # attempt. Environment-dependent — a sensitive mic in a noisy room
                             # can have an ambient floor close to the default, causing Dann to
                             # repeatedly try (and fail) to transcribe background noise. Measure
                             # your room's ambient RMS and raise this above it if so.

wake_word:
  # openWakeWord: fully offline, no account. Built-in phrases (hey_jarvis,
  # alexa, hey_mycroft, ...) work immediately with no setup — just set
  # model to one of those names below instead of a .onnx path. For a custom
  # "ok Dann" phrase: generate training clips (scripts/generate_wakeword_samples.py)
  # then train (scripts/train_wakeword.py), ~1 min on CPU with clips already made.
  engine: openwakeword
  model: models/ok_dann.onnx   # or a built-in name, e.g. hey_jarvis
  threshold: 0.7
  debounce: 4
  cooldown_ms: 2000

  # Porcupine alternative — higher accuracy, but needs a free AccessKey
  # from https://console.picovoice.ai/ and a platform-specific .ppn file:
  # engine: porcupine
  # access_key: YOUR_PICOVOICE_ACCESS_KEY
  # model_path: models/ok_dann.ppn
  # sensitivity: 0.5

stt:
  engine: faster_whisper
  model_size: small         # tiny, base, small, medium, large-v3-turbo
  language: en
  device: auto              # auto (detects CUDA), cpu, cuda
  compute_type: int8

ollama:
  base_url: http://localhost:11434
  model: dann-router   # custom model built from qwen2.5:7b-instruct — see
                       # models/dann-router.Modelfile and scripts/build_router_model.sh.
                       # Not pulled automatically; run the script once after setup,
                       # or set this back to llama3.2/qwen2.5:7b-instruct directly.
  system_prompt: |
    You are a voice assistant with a routing brain. For every request, pick
    the single best-fit agent from the AGENTS list (appended below at
    startup from config.yaml's `agents:` section) and either answer
    yourself (the "local" agent) or call that agent's tool(s).

    Rules:
    - Never call a tool for conversational filler.
    - After any tool call, speak the result naturally in 1-2 sentences and stop.
    - Never call the same tool twice in one turn.
    - Never use markdown, lists, or code formatting in your own responses.
    - Some agents below live in an "optional module" — call enable_module
      with the module name first if you don't see its tools yet. Use
      list_modules if you're unsure what's available or active.
  temperature: 0.7
  max_tokens: 80


tts:
  engine: piper
  # Uses piper-tts Python API (works on M1 Mac). piper_path unused.
  voice_model: models/piper/en_US-lessac-medium
  speed: 1.0

agents:
  # Structured routing targets for Dann's brain — compiled at runtime (see
  # src/agents_config.py) into the "AGENTS" section appended to
  # ollama.system_prompt above, and shared by both voice (src/orchestrator.py)
  # and text chat (app/services/chat_service.py). Add a new routing target
  # here instead of hand-editing prompt prose. `tools` lists the MCP tool
  # name(s) to call for that agent; omit it for "local", which means
  # "answer yourself, no tool call." Set enabled: false to remove an agent
  # from routing without deleting it.
  - name: local
    description: >
      Greetings, small talk, confirmations ("yes", "thanks", "sounds
      good"), and simple facts you're confident about — anything that
      needs one sentence and no research.
    enabled: true

  - name: claude_code
    tools: [list_projects, open_claude_code, ask_claude_code]
    description: >
      Project-aware work on a specific local git repo — summarize/explain
      code, check test coverage, or open an interactive session. Needs a
      project name; use list_projects if unsure what's available.
    enabled: true

  - name: claude_reasoning
    tools: [ask_claude]
    description: >
      General reasoning, analysis, or creative writing that doesn't need a
      project — broader or deeper than the local model should attempt.
      Runs via the claude CLI (your subscription), not a billed API. Pass
      depth="fast" for a quick/cheap answer, depth="deep" (default) for
      thorough reasoning.
    enabled: true

  - name: web_research
    tools: [web_search]
    description: >
      Anything needing current information — news, prices, recent
      releases, or facts likely past the local model's knowledge cutoff.
      Runs via the claude CLI's built-in web search, not a billed API.
    enabled: true

  - name: schedule
    description: "Calendar — view, create, and search events. Optional module — enable_module first."
    enabled: true

  - name: notes
    description: "Quick notes and reminders, stored locally. Optional module — enable_module first."
    enabled: true

  - name: gardening
    description: "Your garden log — what you planted, harvests, and care notes, stored locally. General gardening advice doesn't need this tool, only questions about your own garden. Optional module — enable_module first."
    enabled: true

  - name: bjj
    description: "Your BJJ training log — sessions, techniques, and notes, stored locally. General BJJ questions (technique how-tos, rules) don't need this tool, only questions about your own training. Optional module — enable_module first."
    enabled: true

  - name: devteam
    description: >
      Launches a real, unsupervised multi-phase Claude Code pipeline
      (research, plan, implement, test, devops) against a project, running
      in the background for minutes at a time. Only use for an explicit,
      substantial "build/implement X" request — never for questions,
      explanations, or quick lookups (use claude_code for those). Optional
      module — enable_module first.
    enabled: true

  - name: system
    description: "Local machine control — volume, opening apps, locking the screen. Optional module — enable_module first."
    enabled: true

mcp:
  servers:
    # always_on: true  -> connected at startup, stays up for the session.
    # always_on: false (default) -> registered but dormant; Dann's LLM
    # starts it on demand via the enable_module tool (see src/mcp_client.py).
    - name: projects
      command: .venv/bin/python
      args: ["-m", "src.mcp_servers.claude_code_server"]
      description: "Project discovery, Claude Code sessions, and web search — all via the claude CLI"
      always_on: true

    - name: schedule
      command: .venv/bin/python
      args: ["-m", "src.mcp_servers.schedule_server"]
      description: "Google Calendar — view, create, and search events (needs one-time setup, see schedule-setup.md)"
      always_on: false

    - name: notes
      command: .venv/bin/python
      args: ["-m", "src.mcp_servers.notes_server"]
      description: "Quick notes and reminders, stored locally"
      always_on: false

    - name: gardening
      command: .venv/bin/python
      args: ["-m", "src.mcp_servers.gardening_server"]
      description: "Garden log — plantings, harvests, and care notes, stored locally"
      always_on: false

    - name: bjj
      command: .venv/bin/python
      args: ["-m", "src.mcp_servers.bjj_server"]
      description: "BJJ training log — sessions, techniques, and notes, stored locally"
      always_on: false

    - name: devteam
      command: .venv/bin/python
      args: ["-m", "src.mcp_servers.devteam_server"]
      description: "Background multi-phase Claude Code pipelines (research/plan/implement/test/devops)"
      always_on: false

    - name: system
      command: .venv/bin/python
      args: ["-m", "src.mcp_servers.system_server"]
      description: "Local machine control — volume, opening apps, locking the screen"
      always_on: false

ux:
  play_listening_sound: true
  play_thinking_sound: false

projects:
  # Explicit list of projects Dann can open and query.
  # Paths support ~ expansion. Remove this section to fall back to
  # auto-discovery of all git repos under ~/Git.
  - name: my-project
    path: ~/Git/my-org/my-project
  - name: another-project
    path: ~/Git/my-org/another-project
