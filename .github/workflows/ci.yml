name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # This repo's own Python tests + UI build now live in the pnd-mcp submodule
  # (runtime/) and are covered by that repo's own CI. These jobs just verify
  # the submodule resolves and installs cleanly from this repo's side.
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run runtime tests
        run: pytest runtime/tests/ -v

  ui-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: runtime/ui
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: runtime/ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check + build
        run: npm run build
